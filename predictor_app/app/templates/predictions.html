{% extends 'base.html' %}

{% block content %}

<h1>Predictions for {{ ticker }}</h1>

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

{% for feature in graphs.keys() %}
    <h3>{{ feature }} for {{ ticker }}</h3>
    <div id="chart-{{ feature }}" style="width:100%; height:400px;"></div>
{% endfor %}

<script>
    // Iterating through the graphs dictionary passed from Flask
    var allCharts = {
        {% for feature, graph_json in graphs.items() %}
            "{{ feature }}": JSON.parse({{ graph_json | tojson | safe }}){% if not loop.last %},{% endif %}
        {% endfor %}
    };

    for (var feature in allCharts) {
        var containerId = 'chart-' + feature;
        var figure = allCharts[feature];
        // Plotly expects the parsed data and layout objects
        Plotly.newPlot(containerId, figure.data, figure.layout);
    }
</script>

{% endblock %}
