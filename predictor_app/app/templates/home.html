{% extends 'base.html' %}

{% block content %}

<h1>Home page</h1>
<form  method="post">
    <input type="text" placeholder="Enter stock name or ticker" name="ticker"><br>

    <input type="radio" id = "30-days" value="30 days" name="choice" checked>
    <label for="30-days">30 days</label><br>

    <input type="radio" id = "60-days" value="60 days" name="choice">
    <label for="60-days">60 days</label><br>

    <input type="radio" id = "90-days" value="90 days" name="choice">
    <label for="90-days">90 days</label><br>

    <button type="submit">Enter</button>
</form>

{% endblock %}
